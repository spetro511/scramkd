<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" fill="none">
  <!-- Pitch Black Base Background -->
  <rect width="1200" height="320" fill="#030508"/>

  <!-- Subtle Tactical Cartesian Grid -->
  <path d="M 0 40 L 1200 40 M 0 80 L 1200 80 M 0 120 L 1200 120 M 0 160 L 1200 160 M 0 200 L 1200 200 M 0 240 L 1200 240 M 0 280 L 1200 280" stroke="#0B1220" stroke-width="1"/>
  <path d="M 60 0 L 60 320 M 120 0 L 120 320 M 180 0 L 180 320 M 240 0 L 240 320 M 300 0 L 300 320 M 360 0 L 360 320 M 420 0 L 420 320 M 480 0 L 480 320 M 540 0 L 540 320 M 600 0 L 600 320 M 660 0 L 660 320 M 720 0 L 720 320 M 780 0 L 780 320 M 840 0 L 840 320 M 900 0 L 900 320 M 960 0 L 960 320 M 1020 0 L 1020 320 M 1080 0 L 1080 320 M 1140 0 L 1140 320" stroke="#0B1220" stroke-width="1"/>

  <!-- Outer MIL-SPEC Perimeter Border -->
  <rect x="12" y="12" width="1176" height="296" stroke="#1E293B" stroke-width="1"/>

  <!-- Channel Coordinates & Margin Telemetry -->
  <text x="28" y="32" fill="#F59E0B" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="9" font-weight="700" letter-spacing="1.5">CH-01 // SPEC: MIL-STD-1472H // DETERMINISTIC ISOLATION</text>
  
  <g transform="translate(1054, 22)">
    <rect x="0" y="0" width="118" height="20" fill="#0F172A" stroke="#EF4444" stroke-width="1"/>
    <circle cx="12" cy="10" r="3" fill="#EF4444"/>
    <text x="22" y="14" fill="#EF4444" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="9" font-weight="800" letter-spacing="1">SYS.ABORT</text>
  </g>

  <!-- ================= LEFT: RETICLE EMBLEM (120x120 at offset 44, 96) ================= -->
  <g transform="translate(44, 96)">
    <!-- Base Reticle Box -->
    <rect width="120" height="120" fill="#050B14" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Reticle Grid -->
    <path d="M 0 30 L 120 30 M 0 60 L 120 60 M 0 90 L 120 90" stroke="#0B182B" stroke-width="1"/>
    <path d="M 30 0 L 30 120 M 60 0 L 60 120 M 90 0 L 90 120" stroke="#0B182B" stroke-width="1"/>

    <!-- Corner Brackets: Armed Amber (#F59E0B) -->
    <path d="M 12 24 L 12 12 L 24 12" stroke="#F59E0B" stroke-width="2" stroke-linecap="square"/>
    <path d="M 96 12 L 108 12 L 108 24" stroke="#F59E0B" stroke-width="2" stroke-linecap="square"/>
    <path d="M 12 96 L 12 108 L 24 108" stroke="#F59E0B" stroke-width="2" stroke-linecap="square"/>
    <path d="M 96 108 L 108 108 L 108 96" stroke="#F59E0B" stroke-width="2" stroke-linecap="square"/>

    <!-- Telemetry Etchings -->
    <text x="60" y="19" fill="#F59E0B" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="6" font-weight="700" letter-spacing="0.5" text-anchor="middle">TRIP-CORE</text>
    <text x="60" y="105" fill="#64748B" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="5.5" font-weight="600" letter-spacing="0.5" text-anchor="middle">ISO-99</text>

    <!-- Concentric Machined Rings -->
    <circle cx="60" cy="60" r="38" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 3"/>
    <circle cx="60" cy="60" r="26" stroke="#1E293B" stroke-width="1"/>
    <circle cx="60" cy="60" r="14" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.9"/>
    <circle cx="60" cy="60" r="7" stroke="#EF4444" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Cardinal Axis Ticks -->
    <line x1="60" y1="22" x2="60" y2="34" stroke="#334155" stroke-width="1"/>
    <line x1="60" y1="86" x2="60" y2="98" stroke="#334155" stroke-width="1"/>
    <line x1="22" y1="60" x2="34" y2="60" stroke="#334155" stroke-width="1"/>
    <line x1="86" y1="60" x2="98" y2="60" stroke="#334155" stroke-width="1"/>

    <!-- 45° Diagonal Severance Crosshair -->
    <line x1="25" y1="95" x2="95" y2="25" stroke="#F59E0B" stroke-width="1.5" stroke-linecap="square"/>
    <line x1="25" y1="25" x2="48" y2="48" stroke="#334155" stroke-width="1"/>
    <line x1="72" y1="72" x2="95" y2="95" stroke="#334155" stroke-width="1"/>

    <!-- Radical Red Scram Contact Point -->
    <circle cx="60" cy="60" r="4" fill="#EF4444"/>
    <circle cx="60" cy="60" r="1.5" fill="#FFFFFF"/>
  </g>

  <!-- ================= CENTER-LEFT: SEVERED WORDMARK ================= -->
  <g transform="translate(196, 102)">
    <!-- Main Wordmark: SCRAM KD in pure #FFFFFF ultra-heavy extended monospace -->
    <text x="0" y="70" fill="#FFFFFF" font-family="'JetBrains Mono', 'Space Mono', 'SF Mono', monospace" font-weight="900" font-size="64" letter-spacing="2">SCRAM</text>
    
    <!-- 45-degree Radical Red (#EF4444) Circuit Break Slash -->
    <line x1="248" y1="82" x2="282" y2="22" stroke="#EF4444" stroke-width="5" stroke-linecap="square"/>

    <text x="296" y="70" fill="#FFFFFF" font-family="'JetBrains Mono', 'Space Mono', 'SF Mono', monospace" font-weight="900" font-size="64" letter-spacing="2">KD</text>

    <!-- DEF-CRITICAL Hardware Status Badge -->
    <g transform="translate(422, 34)">
      <rect x="0" y="0" width="102" height="20" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
      <text x="51" y="14" fill="#F59E0B" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="9" font-weight="700" letter-spacing="1" text-anchor="middle">DEF-CRITICAL</text>
    </g>

    <!-- Sub-label in Tactical Emerald (#10B981) -->
    <g transform="translate(0, 96)">
      <rect x="0" y="2" width="7" height="7" fill="#10B981"/>
      <text x="14" y="9" fill="#10B981" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="1.5">SYS.DEF // DETERMINISTIC HARDWARE INTERLOCK // V1.0</text>
      <text x="14" y="23" fill="#64748B" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="8.5" font-weight="600" letter-spacing="1">MACOS KERNEL RING-0 DRIVER • PHYSICAL RELAY SCRAM • NON-BYPASSABLE</text>
    </g>
  </g>

  <!-- ================= RIGHT: TELEMETRY & CONCURRENCY CARDS ================= -->
  <g transform="translate(860, 96)">
    <text x="0" y="10" fill="#F59E0B" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="8" font-weight="700" letter-spacing="1.5">■ AGENT CONTAINMENT TELEMETRY</text>

    <!-- Card 1: SWIFT 6 -->
    <g transform="translate(0, 20)">
      <rect x="0" y="0" width="296" height="28" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="18" fill="#64748B" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="1">[ CORE ]</text>
      <text x="80" y="18" fill="#FFFFFF" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="9" font-weight="700" letter-spacing="1">SWIFT 6.0</text>
      <text x="276" y="18" fill="#10B981" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="8" font-weight="700" letter-spacing="1" text-anchor="end">ACTIVE</text>
    </g>

    <!-- Card 2: COMPLETE CONCURRENCY -->
    <g transform="translate(0, 56)">
      <rect x="0" y="0" width="296" height="28" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
      <text x="12" y="18" fill="#F59E0B" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="1">[ ARCH ]</text>
      <text x="80" y="18" fill="#FFFFFF" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="9" font-weight="700" letter-spacing="1">COMPLETE CONCURRENCY</text>
      <text x="276" y="18" fill="#F59E0B" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="8" font-weight="700" letter-spacing="1" text-anchor="end">STRICT</text>
    </g>

    <!-- Card 3: ZERO EGRESS -->
    <g transform="translate(0, 92)">
      <rect x="0" y="0" width="296" height="28" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
      <text x="12" y="18" fill="#64748B" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="1">[ NETW ]</text>
      <text x="80" y="18" fill="#FFFFFF" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="9" font-weight="700" letter-spacing="1">ZERO EGRESS</text>
      <text x="276" y="18" fill="#EF4444" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="8" font-weight="700" letter-spacing="1" text-anchor="end">AIRGAP</text>
    </g>
  </g>

  <!-- ================= BOTTOM STATUS FOOTER ================= -->
  <line x1="12" y1="282" x2="1188" y2="282" stroke="#1E293B" stroke-width="1"/>
  <text x="28" y="298" fill="#64748B" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="8.5" font-weight="600" letter-spacing="1">SYSTEM: <tspan fill="#FFFFFF">SCRAMKD-v1.0.4-DARWIN</tspan>   |   TRIP TIME: <tspan fill="#10B981">&lt; 1.2ms</tspan>   |   CONTAINMENT PROTOCOL: <tspan fill="#F59E0B">ISOL-HARD-00</tspan></text>

  <g transform="translate(1048, 287)">
    <rect x="0" y="0" width="124" height="18" fill="#EF4444"/>
    <text x="62" y="12.5" fill="#FFFFFF" font-family="'JetBrains Mono', 'SF Mono', monospace" font-size="8" font-weight="800" letter-spacing="0.5" text-anchor="middle">FAIL-SAFE: OPEN</text>
  </g>
</svg>