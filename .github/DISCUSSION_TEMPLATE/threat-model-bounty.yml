title: "[THREAT-MODEL] "
labels: ["security:containment"]
body:
  - type: markdown
    attributes:
      value: |
        ### `scramkd` Public Threat Modeling & Red-Team Hypothesis
        > **Ground Rule:** If you have a live exploit that bypasses an enforced boundary, stop and file a [Private Security Advisory](https://github.com/spetro511/scramkd/security/advisories/new).
        >
        > Use this discussion category to pressure-test our architectural assumptions in the open—thinking like an adversary (or an abliterated agent swarm with raw shell access) probing the boundary between container space and Darwin host memory.
  - type: dropdown
    id: boundary
    attributes:
      label: "Containment Boundary Under Analysis"
      options:
        - "HardwareInterlockGate / PermissivePermit (ScramKCore)"
        - "ContainerCreationPolicy / ContainerSocketBridge (ScramKVirtualization)"
        - "MCPProcessTransport / 7-Key Environment Scrubber (ScramKVirtualization)"
        - "ActiveHoldPolicy / 3-Tier Display P3 HUD (ScramKUI)"
        - "LaunchDaemon / scramkctl Control Socket (scramkd / scramkctl)"
    validations:
      required: true
  - type: textarea
    id: attack_surface
    attributes:
      label: "The Adversarial Hypothesis"
      description: "Assume the agent container is already compromised at tick zero. What timing window, parser ambiguity, OS descriptor nuance, or operator-fatigue trap are you targeting?"
    validations:
      required: true
  - type: textarea
    id: countermeasure
    attributes:
      label: "Proposed Deterministic Countermeasure & Breaker Test"
      description: "How do we kill this entire bug class deterministically (compile-time invariant, kernel socket option, or actor fence), and what XCTest proves the door stays shut?"
    validations:
      required: true
