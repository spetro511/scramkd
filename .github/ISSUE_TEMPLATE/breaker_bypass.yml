name: "⚡ Adversarial Breaker Regression / Concurrency Probe"
description: "Report a state-machine race, continuation leak, POSIX pipe edge case, or strict-concurrency fault."
title: "[BREAKER-00] "
labels: ["severity:medium"]
body:
  - type: markdown
    attributes:
      value: |
        ### Maker-Breaker Concurrency & Fault Probe
        In `scramkd`, every actor state transition and pipe handoff is expected to survive 100-waiter cancellation storms and POSIX fault injection without leaking a single continuation or file descriptor. If you found a timing window, lock contention trap, or edge case that needs a permanent Breaker test, lay it out below.
  - type: dropdown
    id: target
    attributes:
      label: "Owning Test Target"
      options:
        - "ScramKCoreTests"
        - "ScramKVirtualizationTests"
        - "ScramKAudioTests"
        - "ScramKUITests"
    validations:
      required: true
  - type: textarea
    id: mechanism
    attributes:
      label: "What Breaks & Why (Actor / Lock / Descriptor Lifecycle)"
      description: "Trace the exact sequence of events across actor boundaries, OSAllocatedUnfairLock critical sections, or nonblocking POSIX I/O that triggers the fault."
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: "Deterministic XCTest Reproducer"
      description: "Paste the XCTest snippet or swift test invocation that reproduces the failure under complete strict concurrency."
      placeholder: "swift test -Xswiftc -strict-concurrency=complete --filter ..."
    validations:
      required: true
